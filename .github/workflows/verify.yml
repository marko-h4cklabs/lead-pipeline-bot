name: Verify Leads

on:
  workflow_dispatch:
    inputs:
      max_verify:
        description: "Max verifikacija po runu (default: 80)"
        required: false
        default: "80"

permissions:
  contents: read
  id-token: write   # potrebno za Workload Identity Federation OIDC token

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/401516118047/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
          service_account: "lead-pipeline-bot@lead-scraper-august.iam.gserviceaccount.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run verify
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_VERIFY_PER_RUN: ${{ inputs.max_verify }}
        run: python -m scripts.verify.main
